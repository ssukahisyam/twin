plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'id.twin.app'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"

    defaultConfig {
        applicationId "id.twin.app"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("SIGNING_STORE_FILE")
            if (ksFile != null && !ksFile.isEmpty() && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            def ksFile = System.getenv("SIGNING_STORE_FILE")
            signingConfig((ksFile != null && !ksFile.isEmpty() && file(ksFile).exists())
                    ? signingConfigs.release
                    : signingConfigs.debug)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
            excludes.add("/META-INF/{AL2.0,LGPL2.1}")
        }
    }
}

dependencies {
    implementation project(':Bcore')

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.icons
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.coroutines.android
}
