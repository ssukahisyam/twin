name: Build & Release Twin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare release keystore
        id: keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            KS_PATH="$RUNNER_TEMP/twin-release.jks"
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$KS_PATH"
            echo "ks_path=$KS_PATH" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded ($KS_PATH)"
          else
            echo "No SIGNING_KEY_BASE64 secret found; falling back to debug signing"
          fi

      - name: Build Twin Release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.ks_path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep "versionName" build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          OUT="dist/Twin-v${VERSION}.apk"
          cp "$APK" "$OUT"
          ls -lh dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twin-v${{ steps.apk.outputs.version }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          cat << 'EOF' > release_notes.md
          Rilis **Twin** — aplikasi clone / dual app Android minimalis, tanpa iklan, tanpa pelacak.

          ### Fitur Utama
          - **UI Minimalis (Material 3 + Mode Gelap/Terang)** — satu beranda bersih, clone tanpa batas dengan lencana nomor otomatis (`1`, `2`, `3`…).
          - **Perbaikan Google Play Services & Meta (`com.facebook.aura` / Muse)** — jembatan *Host GMS Broker & Signing* otomatis di Android 14–16 agar error *Google Play services missing* teratasi tanpa pengaturan rumit.
          - **Kelola Clone Lengkap** — ganti nama clone, pintasan layar utama, hentikan paksa, reset data, pasang dari file APK/APKS.
          - **Privasi Penuh** — seluruh fitur pengumpul log/telemetri bawaan engine telah dimatikan.
          EOF
          sed -i 's/^          //' release_notes.md
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --title "Twin v${{ steps.apk.outputs.version }}" \
            --notes-file release_notes.md
